---
- name: Require a supported Debian or Ubuntu server with systemd
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
      - >-
        (ansible_facts['distribution'] == 'Debian' and
         ansible_facts['distribution_major_version'] in ['12', '13']) or
        (ansible_facts['distribution'] == 'Ubuntu' and
         ansible_facts['distribution_version'] in ['22.04', '24.04'])
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: Supported targets are Debian 12/13 or Ubuntu 22.04/24.04, amd64/arm64, with systemd.

