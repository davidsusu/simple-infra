---
- name: Install baseline tools from the distribution
  ansible.builtin.apt:
    name:
      - bash
      - vim
      - git
      - nano
      - curl
      - ca-certificates
      - python3
      - python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
